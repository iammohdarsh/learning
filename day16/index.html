<!DOCTYPE html>
<html lang="en">
    <head>
        <title>calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body><div>
            <span id="number1">2</span>
            <span id="operator"></span>
            <span id="number2">3</span>
            <br>
            <div class="operations">
                <button class="btn" id="add" onclick="add()">Add</button>
                <button class="btn" id="subtract" onclick="sub()">Subtract</button>
                <br>
                <button class="btn" id="multiply" onclick="multi()">Multiply</button>
                <button class="btn" id="divide" onclick="div()">Divide</button>
            </div>
            <h5 id="result">Result : </h5>
        </div>
        <script src="index.js"></script>
    </body>
</html>
